name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/payload_test
          PAYLOAD_SECRET: test-secret-key
          TEST_USER_PASSWORD: test-password-ci
          NODE_ENV: test
        run: pnpm run test:int

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Initialize database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/payload_test
          PAYLOAD_SECRET: test-secret-key
          NODE_ENV: test
        run: pnpm run init:db

      # Seed BEFORE build. The homepage and other pages are statically
      # prerendered at `next build` time, so they bake in whatever the
      # DB returns at that point. If we seed AFTER build, prerendered
      # HTML keeps the empty-DB fallbacks (e.g. title="Home" instead of
      # the seeded siteName), and any e2e assertion against prerendered
      # content fails.
      - name: Seed test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/payload_test
          PAYLOAD_SECRET: test-secret-key
          NODE_ENV: test
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test-mock-key
        run: pnpm run seed:e2e

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/payload_test
          PAYLOAD_SECRET: test-secret-key
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test-mock-key
          RESEND_API_KEY: re_test_mock_key
          CONTACT_FORM_TO_EMAIL: test@example.com
          CONTACT_FORM_FROM_EMAIL: test@resend.dev
          CONTACT_FORM_FROM_NAME: Test Contact Form
          BLOB_READ_WRITE_TOKEN: ""
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          GOOGLE_REDIRECT_URI: ""
          GOOGLE_DRIVE_FOLDER_ID: ""
        run: pnpm run build

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/payload_test
          PAYLOAD_SECRET: test-secret-key
          NODE_ENV: test
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test-mock-key
          RESEND_API_KEY: re_test_mock_key
          CONTACT_FORM_TO_EMAIL: test@example.com
          CONTACT_FORM_FROM_EMAIL: test@resend.dev
          CONTACT_FORM_FROM_NAME: Test Contact Form
          BLOB_READ_WRITE_TOKEN: ""
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          GOOGLE_REDIRECT_URI: ""
          GOOGLE_DRIVE_FOLDER_ID: ""
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm run generate:types

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit
