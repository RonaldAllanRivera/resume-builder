<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ronald Allan Rivera — Portfolio</title>
    <meta
      name="description"
      content="Ronald Allan Rivera — Full-stack Web Developer (Python, Django, Laravel, WordPress, React)."
    />
    <style>
      :root{
        --bg:#0b0c0f;
        --panel:#10131a;
        --text:#e8eaf0;
        --muted:#a8b0c2;
        --line:rgba(255,255,255,.10);
        --accent:#7c5cff;
        --accent2:#28d7a7;
        --shadow: 0 20px 60px rgba(0,0,0,.45);
        --r:18px;
        --max:1120px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
        background:
          radial-gradient(1200px 800px at 20% -10%, rgba(124,92,255,.25), transparent 55%),
          radial-gradient(900px 700px at 110% 10%, rgba(40,215,167,.18), transparent 55%),
          radial-gradient(700px 500px at 50% 110%, rgba(255,255,255,.06), transparent 60%),
          var(--bg);
        color:var(--text);
        overflow-x:hidden;
      }
      a{color:inherit; text-decoration:none}
      button{font:inherit}
      .wrap{max-width:var(--max); margin:0 auto; padding:22px}

      /* top bar */
      .topbar{
        position:sticky; top:0; z-index:20;
        backdrop-filter: blur(10px);
        background: rgba(11,12,15,.55);
        border-bottom:1px solid var(--line);
      }
      .topbar .inner{
        display:flex; align-items:center; justify-content:space-between;
        gap:14px; padding:14px 22px;
        max-width:var(--max); margin:0 auto;
      }
      .brand{display:flex; align-items:center; gap:10px; letter-spacing:.3px; font-weight:700;}
      .mark{
        width:34px; height:34px; border-radius:12px;
        background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(40,215,167,.85));
        box-shadow: 0 12px 30px rgba(124,92,255,.22);
      }
      .nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
      .pill{
        padding:10px 12px;
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
        border-radius:999px;
        color:var(--muted);
        cursor:pointer;
        transition: transform .12s ease, border-color .12s ease, background .12s ease;
      }
      .pill:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.18)}
      .pill.active{
        color:var(--text);
        border-color: rgba(124,92,255,.55);
        background: rgba(124,92,255,.12);
      }
      .cta{
        padding:10px 14px;
        border-radius:999px;
        border:1px solid rgba(124,92,255,.45);
        background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(40,215,167,.10));
        color:var(--text);
        cursor:pointer;
        transition: transform .12s ease, filter .12s ease;
      }
      .cta:hover{transform: translateY(-1px); filter: brightness(1.07)}

      /* layout */
      .grid{
        display:grid;
        grid-template-columns: 1.1fr .9fr;
        gap:18px;
        margin-top:18px;
      }
      @media (max-width: 940px){ .grid{grid-template-columns: 1fr} }

      .card{
        border:1px solid var(--line);
        background: rgba(16,19,26,.62);
        border-radius: var(--r);
        box-shadow: var(--shadow);
      }

      /* hero */
      .hero{padding:22px; position:relative; overflow:hidden;}
      .hero:before{
        content:"";
        position:absolute; inset:-2px;
        background:
          radial-gradient(700px 260px at 30% 0%, rgba(124,92,255,.22), transparent 60%),
          radial-gradient(700px 260px at 80% 30%, rgba(40,215,167,.18), transparent 60%);
        pointer-events:none;
      }
      .hero > *{position:relative}
      .kicker{
        display:inline-flex; align-items:center; gap:8px;
        padding:8px 10px; border-radius:999px;
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
        color:var(--muted);
        font-size:13px;
      }
      .dot{
        width:8px; height:8px; border-radius:50%;
        background: var(--accent2);
        box-shadow: 0 0 0 4px rgba(40,215,167,.15);
      }
      h1{
        margin:14px 0 8px;
        font-size: clamp(28px, 4vw, 46px);
        line-height:1.05;
        letter-spacing:-.6px;
      }
      .sub{
        margin:0;
        color:var(--muted);
        font-size: 15.5px;
        line-height:1.6;
        max-width: 66ch;
      }
      .heroActions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
      .ghost{
        padding:10px 14px;
        border-radius:999px;
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
        color:var(--text);
        cursor:pointer;
        transition: transform .12s ease, border-color .12s ease;
      }
      .ghost:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.18)}
      .sep{height:1px; background: var(--line); margin:14px 0}

      /* right column */
      .side{padding:22px;}
      .miniGrid{display:grid; grid-template-columns: repeat(2,1fr); gap:12px;}
      @media (max-width: 520px){ .miniGrid{grid-template-columns:1fr} }
      .stat{
        padding:14px;
        border-radius: 14px;
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
      }
      .stat b{font-size:18px}
      .stat div{color:var(--muted); font-size:13px; margin-top:4px}
      .list{
        margin-top:12px;
        display:grid;
        gap:10px;
      }
      .item{
        padding:12px;
        border-radius: 14px;
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
      }
      .itemTop{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
      .tag{
        font-size:12px; color: var(--muted);
        padding:6px 8px; border-radius:999px;
        border:1px solid var(--line);
        background: rgba(0,0,0,.18);
        white-space:nowrap;
      }
      .item h3{margin:10px 0 6px; font-size:15.5px}
      .item p{margin:0; color:var(--muted); line-height:1.55; font-size:13.5px}
      .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
      .chip{
        font-size:12px;
        padding:6px 8px;
        border-radius:999px;
        border:1px solid rgba(255,255,255,.10);
        background: rgba(255,255,255,.03);
        color: var(--muted);
      }

      /* sections */
      .section{margin-top:18px; padding:22px;}
      .section h2{margin:0 0 10px; font-size: 18px; letter-spacing:.2px;}
      .section p{margin:0; color:var(--muted); line-height:1.7}
      .cols{display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:14px;}
      @media (max-width: 900px){ .cols{grid-template-columns: 1fr} }

      /* modal */
      .backdrop{
        position:fixed; inset:0;
        background: rgba(0,0,0,.55);
        display:flex;
        align-items:flex-end;
        justify-content:center;
        padding: 18px;
        z-index:50;
      }
      .modal{
        width:min(900px, 100%);
        border-radius: 18px;
        border:1px solid var(--line);
        background: rgba(16,19,26,.92);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        overflow:hidden;
        transform: translateY(0);
        animation: pop .18s ease both;
      }
      @keyframes pop{
        from{transform: translateY(10px); opacity:.0}
        to{transform: translateY(0); opacity:1}
      }
      .modalHead{
        padding:16px 18px;
        display:flex;
        justify-content:space-between;
        gap:12px;
        border-bottom:1px solid var(--line);
        background: rgba(255,255,255,.02);
      }
      .x{
        border:1px solid var(--line);
        background: rgba(255,255,255,.03);
        color:var(--text);
        border-radius: 12px;
        padding:10px 12px;
        cursor:pointer;
      }
      .modalBody{padding:18px}
      .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
      footer{padding:22px; color: var(--muted); font-size: 13px; text-align:center;}
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- React (UMD) + Babel for single-file usage -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const {useEffect, useMemo, useState} = React;

      // ===== Your Resume Data (from your PDF) =====
      const RESUME = {
        name: "Ronald Allan Rivera",
        kicker: "Full-stack Web Developer • 20+ years experience",
        headline: "Production-ready web systems for eCommerce, SaaS, AI & marketing.",
        summary:
          "I’m a full-stack Web Developer with 20+ years of experience delivering production-ready solutions across eCommerce, SaaS, AI, and marketing technology. I specialize in Python automation, backend systems with Laravel/PHP and Python/Django, scalable WordPress plugin development, and modern frontends with React, Vue, Next.js, and Inertia. I focus on performance, security, SEO, and maintainability so every project is scalable, optimized, and future-proof.",
        contact: {
          portfolio: "https://allanwebdesign.com",
          email: "jaeron.rivera@gmail.com",
          linkedin: "https://www.linkedin.com/in/ronald-allan-rivera-a43aaa63/",
          github: "https://github.com/RonaldAllanRivera/",
          mobile: "+63-927-023-8592",
          location: "Agoo, La Union, Philippines"
        },
        highlights: [
          { label: "Core Focus", value: "Python • Laravel • Django • WordPress • React" },
          { label: "Strengths", value: "Performance, Security, SEO, Maintainability" },
          { label: "Recent Work", value: "Automation tools, dashboards, lead-gen, reporting" },
          { label: "Availability", value: "Freelance / Remote / Contract" },
        ],
        latestExperience: [
          {
            role: "Web Developer",
            company: "LogicMedia BV",
            when: "June 2015 — Present",
            blurb:
              "Lead end-to-end web development for high-performance marketing & interstitial websites; build internal tools using Python/Django/React/Next; manage Cloudflare/CDN for performance & security."
          },
          {
            role: "Senior Web Programmer and Web Designer",
            company: "PulseIQ.com",
            when: "July 2007 — Present",
            blurb:
              "Lead partner websites (WordPress/Elementor), build custom plugins & responsive themes, create automation pipelines (Zapier/Make.com), and develop Python extraction/automation tools."
          }
        ],
        featuredProjects: [
          {
            title: "Meet Lessons",
            tag: "Django + Python",
            desc: "SaaS platform combining a Python OCR desktop client + Django backend for AI-assisted Q&A from screenshots. Multi-tenant, device pairing, Stripe subscriptions, SSE streaming.",
            stack: ["Django", "Python", "Stripe", "Docker", "SSE"],
            link: "https://github.com/RonaldAllanRivera/auto-respond/"
          },
          {
            title: "Forex Signals Platform (D1/W1/MN1)",
            tag: "Laravel 12",
            desc: "Trading analysis platform with automated syncing, AI-generated signals, TradingView charts, scheduler-driven jobs, admin workflows, and daily email reports.",
            stack: ["Laravel 12", "Filament", "Docker"],
            link: "https://github.com/RonaldAllanRivera/forex"
          },
          {
            title: "Figma to Elementor Clone",
            tag: "Laravel",
            desc: "Converts Figma designs into clean HTML previews and Elementor-compatible JSON exports for WordPress import, with authenticated project management.",
            stack: ["Laravel", "HTML Export", "Docker"],
            link: "https://github.com/RonaldAllanRivera/elementor-clone"
          },
          {
            title: "Featured Resource Block",
            tag: "WordPress Plugin",
            desc: "Production-ready plugin with CPT, Elementor widget, scheduled JSON syncing, caching, and hardened security.",
            stack: ["WP Plugin", "Elementor", "Caching"],
            link: "https://github.com/RonaldAllanRivera/featured-resource-block"
          }
        ],
        primarySkills: [
          "Python Automation", "Laravel / PHP", "Django", "WordPress Plugins", "React / Next.js",
          "API Development", "Stripe Webhooks", "Docker", "Cloudflare / CDN", "SEO + Performance"
        ]
      };

      function useEscape(handler){
        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") handler?.(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [handler]);
      }

      function Topbar({active, setActive, onContact}){
        const items = [
          {key:"home", label:"Home"},
          {key:"projects", label:"Projects"},
          {key:"experience", label:"Experience"},
          {key:"contact", label:"Contact"},
        ];

        return (
          <div className="topbar">
            <div className="inner">
              <div className="brand" role="banner" aria-label="Brand">
                <div className="mark" aria-hidden="true"></div>
                <div>
                  <div style={{fontSize:14}}>{RESUME.name}</div>
                  <div style={{fontSize:12, color:"var(--muted)"}} className="mono">Portfolio homepage (React)</div>
                </div>
              </div>

              <div className="nav" role="navigation" aria-label="Primary">
                {items.map(it => (
                  <button
                    key={it.key}
                    className={"pill" + (active === it.key ? " active" : "")}
                    onClick={() => {
                      if (it.key === "contact") onContact();
                      else setActive(it.key);
                    }}
                  >
                    {it.label}
                  </button>
                ))}
                <a className="cta" href={RESUME.contact.portfolio} target="_blank" rel="noreferrer">
                  Visit Portfolio
                </a>
              </div>
            </div>
          </div>
        );
      }

      function ProjectModal({project, onClose}){
        useEscape(onClose);
        return (
          <div className="backdrop" role="dialog" aria-modal="true" aria-label="Project details"
               onMouseDown={(e)=>{ if(e.target.classList.contains("backdrop")) onClose(); }}>
            <div className="modal">
              <div className="modalHead">
                <div>
                  <div style={{fontWeight:700}}>{project.title}</div>
                  <div style={{color:"var(--muted)", fontSize:13}}>{project.tag}</div>
                </div>
                <button className="x" onClick={onClose} aria-label="Close">Close</button>
              </div>
              <div className="modalBody">
                <div style={{display:"grid", gap:12}}>
                  <div className="item">
                    <div className="tag">Summary</div>
                    <h3 style={{marginBottom:6}}>What it is</h3>
                    <p>{project.desc}</p>
                    <div className="chips">
                      {project.stack.map(s => <span key={s} className="chip">{s}</span>)}
                    </div>
                  </div>

                  <div className="item">
                    <div className="tag">Link</div>
                    <h3 style={{marginBottom:6}}>Repository / Preview</h3>
                    <p className="mono">
                      <a href={project.link} target="_blank" rel="noreferrer">{project.link}</a>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function ContactModal({onClose}){
        useEscape(onClose);
        const c = RESUME.contact;

        const copy = async (text) => {
          try{
            await navigator.clipboard.writeText(text);
            alert("Copied!");
          }catch{
            alert("Copy failed. You can select and copy manually.");
          }
        };

        return (
          <div className="backdrop" role="dialog" aria-modal="true" aria-label="Contact"
               onMouseDown={(e)=>{ if(e.target.classList.contains("backdrop")) onClose(); }}>
            <div className="modal">
              <div className="modalHead">
                <div>
                  <div style={{fontWeight:700}}>Contact</div>
                  <div style={{color:"var(--muted)", fontSize:13}}>Press <span className="mono">Esc</span> to close.</div>
                </div>
                <button className="x" onClick={onClose}>Close</button>
              </div>
              <div className="modalBody">
                <div className="cols">
                  <div className="item">
                    <div className="tag">Direct</div>
                    <h3 style={{marginBottom:6}}>Email</h3>
                    <p className="mono">{c.email}</p>
                    <div style={{display:"flex", gap:10, flexWrap:"wrap", marginTop:10}}>
                      <a className="cta" href={`mailto:${c.email}`}>Email me</a>
                      <button className="ghost" onClick={() => copy(c.email)}>Copy email</button>
                    </div>

                    <div className="sep"></div>
                    <h3 style={{marginBottom:6}}>Mobile</h3>
                    <p className="mono">{c.mobile}</p>
                    <button className="ghost" onClick={() => copy(c.mobile)} style={{marginTop:10}}>Copy mobile</button>
                  </div>

                  <div className="item">
                    <div className="tag">Links</div>
                    <h3 style={{marginBottom:6}}>Profiles</h3>
                    <div style={{display:"grid", gap:10}}>
                      <a className="ghost" href={c.portfolio} target="_blank" rel="noreferrer">Portfolio</a>
                      <a className="ghost" href={c.linkedin} target="_blank" rel="noreferrer">LinkedIn</a>
                      <a className="ghost" href={c.github} target="_blank" rel="noreferrer">GitHub</a>
                    </div>
                    <div className="sep"></div>
                    <p style={{color:"var(--muted)", margin:0, lineHeight:1.6}}>
                      Location: {c.location}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function Home({openProject, openContact}){
        return (
          <div className="wrap">
            {/* Hero row (Monogram-like: left hero, right cards) */}
            <div className="grid">
              <div className="card hero">
                <div className="kicker"><span className="dot"></span>{RESUME.kicker}</div>
                <h1>{RESUME.headline}</h1>
                <p className="sub">{RESUME.summary}</p>

                <div className="heroActions">
                  <button className="cta" onClick={() => {
                    document.getElementById("projects")?.scrollIntoView({behavior:"smooth"});
                  }}>
                    View projects
                  </button>
                  <button className="ghost" onClick={openContact}>Contact</button>
                  <a className="ghost" href={RESUME.contact.linkedin} target="_blank" rel="noreferrer">
                    LinkedIn
                  </a>
                </div>

                <div className="sep"></div>

                <div className="chips">
                  {RESUME.primarySkills.slice(0,10).map(s => <span key={s} className="chip">{s}</span>)}
                </div>
              </div>

              <div className="card side">
                <div className="miniGrid">
                  {RESUME.highlights.map(h => (
                    <div key={h.label} className="stat">
                      <b>{h.label}</b>
                      <div>{h.value}</div>
                    </div>
                  ))}
                </div>

                <div className="sep"></div>

                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:10}}>
                  <div style={{fontWeight:700}}>Latest Experience</div>
                  <div className="tag">Current</div>
                </div>

                <div className="list">
                  {RESUME.latestExperience.map(x => (
                    <div key={x.role + x.company} className="item">
                      <div className="itemTop">
                        <div className="tag">{x.role}</div>
                        <div className="tag">{x.when}</div>
                      </div>
                      <h3>{x.company}</h3>
                      <p>{x.blurb}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Featured projects row */}
            <div id="projects" className="card section">
              <h2>Featured Projects</h2>
              <p>Selected builds pulled from your resume—click to open details.</p>

              <div className="cols">
                {RESUME.featuredProjects.map(p => (
                  <div key={p.title} className="item" style={{cursor:"pointer"}}
                       onClick={() => openProject(p)}
                       onKeyDown={(e)=>{ if(e.key==="Enter") openProject(p); }}
                       tabIndex={0}
                       role="button"
                       aria-label={"Open project " + p.title}>
                    <div className="itemTop">
                      <div className="tag">{p.tag}</div>
                      <div className="tag">Featured</div>
                    </div>
                    <h3>{p.title}</h3>
                    <p>{p.desc}</p>
                    <div className="chips">
                      {p.stack.slice(0,5).map(s => <span key={s} className="chip">{s}</span>)}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Quick contact strip */}
            <div className="card section">
              <h2>Let’s build something reliable.</h2>
              <p>
                I focus on performance, security, SEO, and maintainability—so your project stays fast and future-proof.
              </p>
              <div className="sep"></div>
              <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
                <button className="cta" onClick={openContact}>Contact</button>
                <a className="ghost" href={RESUME.contact.github} target="_blank" rel="noreferrer">GitHub</a>
                <a className="ghost" href={RESUME.contact.portfolio} target="_blank" rel="noreferrer">Portfolio</a>
                <a className="ghost" href={`mailto:${RESUME.contact.email}`}>Email</a>
              </div>
            </div>

            <footer>
              <div>© {new Date().getFullYear()} {RESUME.name} • Built with React (single file)</div>
              <div className="mono" style={{marginTop:6}}>Tip: Move this into Vite/Next later for production.</div>
            </footer>
          </div>
        );
      }

      function App(){
        const [active, setActive] = useState("home");
        const [contactOpen, setContactOpen] = useState(false);
        const [project, setProject] = useState(null);

        // keep top nav "Home" active (this is a single-page homepage)
        useEffect(() => { setActive("home"); }, []);

        return (
          <>
            <Topbar
              active={active}
              setActive={(k)=>{
                if (k === "projects") document.getElementById("projects")?.scrollIntoView({behavior:"smooth"});
                else if (k === "experience") alert("If you want, I can add a full Experience section below.");
                else setActive(k);
              }}
              onContact={()=>setContactOpen(true)}
            />

            <Home
              openProject={(p)=>setProject(p)}
              openContact={()=>setContactOpen(true)}
            />

            {project && <ProjectModal project={project} onClose={()=>setProject(null)} />}
            {contactOpen && <ContactModal onClose={()=>setContactOpen(false)} />}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
