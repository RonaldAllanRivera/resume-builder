services:
  app:
    image: node:22-alpine
    container_name: resume-builder-app
    ports:
      - '3000:3000'
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Use named volume for node_modules to avoid platform conflicts
      - node_modules:/app/node_modules
      # Cache pnpm store for faster rebuilds
      - pnpm-store:/root/.local/share/pnpm/store
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Override DATABASE_URL to use Docker service name instead of 127.0.0.1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/payload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: resume-builder-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: resume-builder-postgres-data
  node_modules:
    name: resume-builder-node-modules
  pnpm-store:
    name: resume-builder-pnpm-store
